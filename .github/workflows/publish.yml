name: Publish

on:
  push:
    tags:
      - "kumo-v*"
      - "kumo-derive-v*"
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate to publish"
        required: true
        default: "kumo"
        type: choice
        options:
          - kumo
          - kumo-derive
      dry_run_only:
        description: "Only run publish dry-run"
        required: true
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Resolve crate version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" == kumo-derive-v* ]]; then
            crate="kumo-derive"
            version="${GITHUB_REF_NAME#kumo-derive-v}"
          elif [[ "${GITHUB_REF_NAME}" == kumo-v* ]]; then
            crate="kumo"
            version="${GITHUB_REF_NAME#kumo-v}"
          else
            crate="${{ inputs.crate }}"
            version="$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg crate "$crate" '.packages[] | select(.name == $crate) | .version')"
          fi

          if [[ -z "${version}" || "${version}" == "null" ]]; then
            echo "Could not resolve version for crate: ${crate}" >&2
            exit 1
          fi

          echo "crate=${crate}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check crates.io version
        id: crates_io
        shell: bash
        run: |
          set -euo pipefail

          crate="${{ steps.release.outputs.crate }}"
          version="${{ steps.release.outputs.version }}"
          url="https://crates.io/api/v1/crates/${crate}/${version}"

          if curl --fail --silent --show-error \
            --user-agent "wihlarkop/kumo publish workflow" \
            "$url" > /dev/null; then
            echo "${crate}@${version} already exists on crates.io; publish will be skipped."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "${crate}@${version} is not on crates.io yet."
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests before publishing
        if: ${{ steps.crates_io.outputs.published != 'true' }}
        run: cargo test --workspace

      - name: Dry-run kumo-derive publish
        if: ${{ steps.release.outputs.crate == 'kumo-derive' && steps.crates_io.outputs.published != 'true' }}
        run: cargo publish -p kumo-derive --dry-run

      - name: Dry-run kumo publish
        if: ${{ steps.release.outputs.crate == 'kumo' && steps.crates_io.outputs.published != 'true' }}
        run: cargo publish -p kumo --dry-run

      - name: Publish kumo-derive to crates.io
        if: ${{ steps.release.outputs.crate == 'kumo-derive' && steps.crates_io.outputs.published != 'true' && inputs.dry_run_only != true }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set +e
          output="$(cargo publish -p kumo-derive 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"

          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi

          if printf '%s\n' "$output" | grep -q "already exists"; then
            echo "kumo-derive@${{ steps.release.outputs.version }} already exists on crates.io; treating publish as success."
            exit 0
          fi

          exit "$status"

      - name: Publish kumo to crates.io
        if: ${{ steps.release.outputs.crate == 'kumo' && steps.crates_io.outputs.published != 'true' && inputs.dry_run_only != true }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set +e
          output="$(cargo publish -p kumo 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"

          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi

          if printf '%s\n' "$output" | grep -q "already exists"; then
            echo "kumo@${{ steps.release.outputs.version }} already exists on crates.io; treating publish as success."
            exit 0
          fi

          exit "$status"
