name: Benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Benchmark mode to run.
        required: true
        default: local
        type: choice
        options:
          - local
          - real
          - scale
      runs:
        description: Number of runs for local or real benchmarks.
        required: true
        default: "3"
      concurrency:
        description: Crawl concurrency for local or real benchmarks.
        required: true
        default: "16"

permissions:
  contents: read

jobs:
  benchmark:
    name: Run benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Preserve checked-in benchmark baseline
        if: inputs.mode != 'scale'
        run: |
          if [ "${{ inputs.mode }}" = "local" ]; then
            cp benchmark/baselines/local.json "$RUNNER_TEMP/benchmark-baseline.json"
          else
            cp benchmark/baselines/real.json "$RUNNER_TEMP/benchmark-baseline.json"
          fi

      - name: Run local mock benchmark
        if: inputs.mode == 'local'
        working-directory: benchmark
        run: bash run.sh --local --runs=${{ inputs.runs }} --concurrency=${{ inputs.concurrency }}

      - name: Run real-site benchmark
        if: inputs.mode == 'real'
        working-directory: benchmark
        run: bash run.sh --runs=${{ inputs.runs }} --concurrency=${{ inputs.concurrency }}

      - name: Run scaling benchmark
        if: inputs.mode == 'scale'
        working-directory: benchmark
        run: bash run.sh --scale

      - name: Compare benchmark results
        if: inputs.mode != 'scale'
        run: |
          if [ "${{ inputs.mode }}" = "local" ]; then
            current="benchmark/results/latest_local.json"
          else
            current="benchmark/results/latest.json"
          fi
          cargo run -p kumo-benchmark-compare -- \
            "$RUNNER_TEMP/benchmark-baseline.json" \
            "$current" \
            --output benchmark/results/comparison.md \
            --json-output benchmark/results/comparison.json
          cat benchmark/results/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-${{ inputs.mode }}-${{ github.run_number }}
          path: |
            benchmark/results/*.json
            benchmark/results/*.md
            benchmark/results/scale/*.json
          if-no-files-found: warn
          retention-days: 7
