name: Benchmark

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Benchmark mode to run.
        required: true
        default: local
        type: choice
        options:
          - local
          - real
          - scale
          - soak
          - large
          - realistic
          - realistic-compare
          - store
          - frontier
          - scheduler
          - scheduler-compare
      baseline_ref:
        description: Git ref containing the benchmark-only baseline for comparison modes.
        required: true
        default: main
      runs:
        description: Number of runs for local, real, or realistic comparison benchmarks.
        required: true
        default: "3"
      seed:
        description: Realistic comparison order seed; 0 derives one from the workflow run.
        required: true
        default: "0"
      concurrency:
        description: Crawl concurrency for local, real, or realistic benchmarks.
        required: true
        default: "16"
      total_pages:
        description: Optional soak/large page override; 0 uses the mode default.
        required: true
        default: "0"
      items_per_page:
        description: Items generated on each soak/large page.
        required: true
        default: "20"

permissions:
  contents: read

jobs:
  benchmark:
    name: Run benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Preserve checked-in benchmark baseline
        if: inputs.mode == 'local' || inputs.mode == 'real'
        run: |
          if [ "${{ inputs.mode }}" = "local" ]; then
            cp benchmark/baselines/local.json "$RUNNER_TEMP/benchmark-baseline.json"
          else
            cp benchmark/baselines/real.json "$RUNNER_TEMP/benchmark-baseline.json"
          fi

      - name: Run local mock benchmark
        if: inputs.mode == 'local'
        working-directory: benchmark
        run: bash run.sh --local --runs=${{ inputs.runs }} --concurrency=${{ inputs.concurrency }}

      - name: Run real-site benchmark
        if: inputs.mode == 'real'
        working-directory: benchmark
        run: bash run.sh --runs=${{ inputs.runs }} --concurrency=${{ inputs.concurrency }}

      - name: Run scaling benchmark
        if: inputs.mode == 'scale'
        working-directory: benchmark
        run: |
          bash run.sh --scale
          cat results/scale/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run 10k-item soak validation
        if: inputs.mode == 'soak'
        working-directory: benchmark
        run: |
          bash run.sh --soak --concurrency=${{ inputs.concurrency }} \
            --pages=${{ inputs.total_pages }} --items-per-page=${{ inputs.items_per_page }}
          cat results/soak/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run 100k-item large-crawl validation
        if: inputs.mode == 'large'
        working-directory: benchmark
        timeout-minutes: 45
        run: |
          bash run.sh --large --concurrency=${{ inputs.concurrency }} \
            --pages=${{ inputs.total_pages }} --items-per-page=${{ inputs.items_per_page }}
          cat results/large/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run realistic resilience benchmark
        if: inputs.mode == 'realistic'
        working-directory: benchmark
        timeout-minutes: 45
        run: |
          bash run.sh --realistic --concurrency=${{ inputs.concurrency }}
          cat results/realistic/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run realistic framework comparison
        if: inputs.mode == 'realistic-compare'
        working-directory: benchmark
        timeout-minutes: 45
        run: |
          bash run.sh --realistic-compare \
            --runs=${{ inputs.runs }} \
            --seed=${{ inputs.seed }} \
            --concurrency=${{ inputs.concurrency }}
          cat results/realistic-compare/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run output-store overhead benchmark
        if: inputs.mode == 'store'
        working-directory: benchmark
        timeout-minutes: 45
        run: |
          bash run.sh --store --concurrency=${{ inputs.concurrency }}
          cat results/store/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run memory frontier benchmark
        if: inputs.mode == 'frontier'
        timeout-minutes: 30
        run: cargo bench --bench hot_path -- memory_frontier --noplot

      - name: Run crawl scheduler benchmark
        if: inputs.mode == 'scheduler'
        timeout-minutes: 30
        run: cargo bench --bench hot_path -- crawl_scheduler --noplot

      - name: Compare crawl scheduler with baseline
        if: inputs.mode == 'scheduler-compare'
        timeout-minutes: 45
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          baseline_sha="$(git rev-parse --verify "$BASELINE_REF^{commit}")"
          git checkout --detach "$baseline_sha"
          cargo bench --bench hot_path -- crawl_scheduler \
            --save-baseline comparison-base --noplot
          git checkout --detach "$head_sha"
          cargo bench --bench hot_path -- crawl_scheduler \
            --baseline comparison-base --noplot

      - name: Compare benchmark results
        if: inputs.mode == 'local' || inputs.mode == 'real'
        run: |
          if [ "${{ inputs.mode }}" = "local" ]; then
            current="benchmark/results/latest_local.json"
          else
            current="benchmark/results/latest.json"
          fi
          cargo run -p kumo-benchmark-compare -- \
            "$RUNNER_TEMP/benchmark-baseline.json" \
            "$current" \
            --output benchmark/results/comparison.md \
            --json-output benchmark/results/comparison.json
          cat benchmark/results/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-${{ inputs.mode }}-${{ github.run_number }}
          path: |
            benchmark/results/*.json
            benchmark/results/*.md
            benchmark/results/scale/*.json
            benchmark/results/scale/*.md
            benchmark/results/soak/*.json
            benchmark/results/soak/*.md
            benchmark/results/large/*.json
            benchmark/results/large/*.md
            benchmark/results/realistic/*.json
            benchmark/results/realistic/*.md
            benchmark/results/realistic-compare/
            benchmark/results/store/
            target/criterion/memory_frontier/**/estimates.json
            target/criterion/memory_frontier/**/sample.json
            target/criterion/crawl_scheduler/**/estimates.json
            target/criterion/crawl_scheduler/**/sample.json
          if-no-files-found: warn
          retention-days: 7
