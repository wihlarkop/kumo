name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --all-targets

      - name: Run unit tests
        run: cargo test --lib

      - name: Run integration tests
        run: cargo test --tests

      - name: Run derive macro tests
        run: cargo test --features derive --test derive_macro

  feature-matrix:
    name: Feature flags (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "derive"
          - "sqlite"
          - "jsonpath"
          - "persistence"
          - "sqlite jsonpath persistence"
          - "llm"
          - "otel"
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-feat-${{ matrix.features || 'default' }}-${{
            hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-feat-

      - name: Build
        run: |
          FEATURES=$(echo "${{ matrix.features }}" | tr ' ' ',')
          if [ -z "$FEATURES" ]; then
            cargo build
          else
            cargo build --features "$FEATURES"
          fi

      - name: Test
        run: |
          FEATURES=$(echo "${{ matrix.features }}" | tr ' ' ',')
          if [ -z "$FEATURES" ]; then
            cargo test
          else
            cargo test --features "$FEATURES"
          fi

  broad-feature-check:
    name: Broad non-stealth feature check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-broad-features-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-broad-features-

      - name: Check broad feature set
        run: >
          cargo check --workspace --all-targets
          --features "postgres sqlite mysql llm claude openai gemini ollama jsonpath xpath browser persistence redis-frontier derive otel cloud cloud-s3 cloud-gcs cloud-azure"

  stealth:
    name: Stealth feature (BoringSSL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install BoringSSL build deps
        run: sudo apt-get update && sudo apt-get install -y cmake nasm

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stealth-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-stealth-

      - name: Check stealth feature
        run: cargo check --features stealth

      - name: Check stealth + browser
        run: cargo check --features stealth,browser

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-

      - name: Check compiles on MSRV
        run: cargo check --lib

  lint:
    name: Clippy & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (postgres feature)
        run: cargo clippy --all-targets --features postgres -- -D warnings

      - name: Clippy (sqlite feature)
        run: cargo clippy --all-targets --features sqlite -- -D warnings

      - name: Clippy (mysql feature)
        run: cargo clippy --all-targets --features mysql -- -D warnings

      - name: Clippy (cloud feature)
        run: cargo clippy --all-targets --features cloud -- -D warnings

      - name: Format check
        run: cargo fmt --check

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo audit
        run: cargo audit

  package:
    name: Package dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-package-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-package-

      - name: Dry-run kumo-derive package
        run: cargo publish -p kumo-derive --dry-run

      - name: Dry-run kumo package
        run: |
          version="$(awk '/^\[package\]/{in_package=1; next} /^\[/{in_package=0} in_package && /^version = / {gsub(/"/, "", $3); print $3; exit}' Cargo.toml)"
          if curl --fail --silent --show-error \
            --user-agent "wihlarkop/kumo ci package dry-run" \
            "https://crates.io/api/v1/crates/kumo/${version}" > /dev/null; then
            echo "kumo@${version} already exists on crates.io; skipping package dry-run."
          else
            cargo publish -p kumo --dry-run
          fi

  benchmarks:
    name: Benchmark compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bench-

      - name: Compile benchmarks
        run: cargo bench --no-run

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v5
        with:
          working-directory: docs

      - name: Install docs dependencies
        run: uv sync
        working-directory: docs

      - name: Build docs strictly
        run: uv run mkdocs build --strict
        working-directory: docs
