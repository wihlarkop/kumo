services:
  kumo:
    build:
      context: ..
      dockerfile: benchmark/kumo/Dockerfile
      args:
        KUMO_VERSION: ${KUMO_VERSION:-unknown}
    environment:
      - TARGET_URL=${TARGET_URL:-https://books.toscrape.com/catalogue/page-1.html}
      - TARGET_URLS=${TARGET_URLS:-}
      - SCALE_MODE=${SCALE_MODE:-false}
      - SOAK_MODE=${SOAK_MODE:-false}
      - REALISTIC_MODE=${REALISTIC_MODE:-false}
      - CONCURRENCY=${CONCURRENCY:-16}
    volumes:
      - ./results:/results
    networks:
      - bench

  scrapy:
    build:
      context: ./scrapy
    environment:
      - TARGET_URL=${TARGET_URL:-https://books.toscrape.com/catalogue/page-1.html}
      - CONCURRENCY=${CONCURRENCY:-16}
    volumes:
      - ./results:/results
    networks:
      - bench

  colly:
    build:
      context: ./colly
    environment:
      - TARGET_URL=${TARGET_URL:-https://books.toscrape.com/catalogue/page-1.html}
      - CONCURRENCY=${CONCURRENCY:-16}
    volumes:
      - ./results:/results
    networks:
      - bench

  mockserver:
    build:
      context: ./mockserver
      args:
        TOTAL_PAGES: ${TOTAL_PAGES:-50}
        ITEMS_PER_PAGE: ${ITEMS_PER_PAGE:-20}
        WORKLOAD_CHAINS: ${WORKLOAD_CHAINS:-100}
    networks:
      - bench

  realisticserver:
    build:
      context: ./realisticserver
    ports:
      - "18080:80"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost/health')"
      interval: 1s
      timeout: 1s
      retries: 30
    networks:
      - bench

networks:
  bench:
